<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Thu Cũ & Trợ Giá Lên Đời</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Chakra+Petch:wght@700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { fontFamily: { sans: ['Be Vietnam Pro', 'sans-serif'], tech: ['Chakra Petch', 'sans-serif'] } } }
        }
    </script>
    <style>
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in-up { animation: fadeInUp 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .dom-btn.active { background: linear-gradient(135deg, rgba(245, 158, 11, 0.25), rgba(217, 119, 6, 0.2)); border-color: #f59e0b; color: #fbbf24; font-weight: 700;}
        .maymy-btn.active { background: linear-gradient(135deg, rgba(59, 130, 246, 0.25), rgba(37, 99, 235, 0.2)); border-color: #3b82f6; color: #60a5fa; font-weight: 700;}
        html:not(.dark) .dom-btn.active { background: #fef3c7; border-color: #f59e0b; color: #b45309; }
        html:not(.dark) .maymy-btn.active { background: #dbeafe; border-color: #3b82f6; color: #1d4ed8; }
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #64748b; border-radius: 4px; }
    </style>
</head>
<body class="bg-slate-100 dark:bg-slate-950 text-slate-900 dark:text-slate-100 font-sans antialiased min-h-screen pb-10">

    <!-- HEADER -->
    <header class="sticky top-0 z-50 bg-white/90 dark:bg-slate-950/90 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 py-2.5 px-3 shadow-sm">
        <div class="max-w-3xl mx-auto flex items-center justify-between">
            <div>
                <h1 class="text-base sm:text-xl font-bold text-red-600 dark:text-red-500 tracking-wider uppercase font-tech">Định Giá Thu Cũ & Trợ Giá</h1>
                <p class="text-[11px] text-slate-500 dark:text-slate-400 font-medium">Hệ thống hỗ trợ định giá cửa hàng</p>
            </div>
            <button onclick="toggleTheme()" class="p-2 rounded-xl bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 transition flex items-center gap-1.5 text-xs font-bold shrink-0">
                <span id="themeIcon">☀️</span><span id="themeText" class="hidden sm:inline">Giao diện Tối</span>
            </button>
        </div>
    </header>

    <div class="max-w-3xl mx-auto space-y-4 px-3 mt-3">
        <!-- 1. SẢN PHẨM THU CŨ -->
        <div class="relative z-40 bg-white dark:bg-slate-900 rounded-2xl p-3.5 sm:p-4 shadow-sm border border-slate-200 dark:border-slate-800">
            <div class="flex items-center gap-2 mb-3 border-b border-slate-200 dark:border-slate-800 pb-2">
                <span class="bg-red-600 text-white w-6 h-6 rounded-md flex items-center justify-center font-bold text-xs shrink-0">1</span>
                <h2 class="text-xs sm:text-sm font-bold uppercase tracking-wider font-tech">Sản phẩm thu cũ</h2>
            </div>
            <div class="flex gap-2">
                <input type="text" id="searchInput" onkeydown="if(event.key === 'Enter') searchPhones()" placeholder="Nhập tên máy (vd: iPhone 12 Pro Max)..." class="w-full flex-1 px-3 py-2 bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded-xl text-xs sm:text-sm focus:outline-none focus:border-red-500">
                <button onclick="searchPhones()" class="bg-red-600 hover:bg-red-500 text-white px-4 py-2 rounded-xl text-xs sm:text-sm font-bold shrink-0">Tìm máy</button>
            </div>
            <div id="frequentChips" class="flex flex-wrap gap-1.5 mt-2.5 pt-2 border-t border-slate-200 dark:border-slate-800/60"></div>
            <div id="phoneList" class="hidden mt-2 grid grid-cols-1 gap-1.5 max-h-48 overflow-y-auto custom-scroll border border-slate-200 dark:border-slate-800 p-2 rounded-xl bg-slate-50 dark:bg-slate-950"></div>
        </div>

        <!-- 2. TÌNH TRẠNG & TRỪ LỖI -->
        <div id="conditionSection" class="relative z-30 bg-white dark:bg-slate-900 rounded-2xl p-3.5 sm:p-4 shadow-sm border border-slate-200 dark:border-slate-800 hidden space-y-4 animate-fade-in-up">
            <!-- Chọn Loại -->
            <div>
                <div class="flex items-center gap-2 mb-2.5 border-b border-slate-200 dark:border-slate-800 pb-2">
                    <span class="bg-red-600 text-white w-6 h-6 rounded-md flex items-center justify-center font-bold text-xs shrink-0">2</span>
                    <h2 class="text-xs sm:text-sm font-bold uppercase font-tech">Tình trạng máy <span id="selectedPhoneName" class="text-red-600 ml-1"></span></h2>
                </div>
                <div class="relative" id="conditionDropdownContainer">
                    <button type="button" onclick="toggleDropdown('conditionSelectMenu')" class="w-full px-3 py-2.5 bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded-xl font-bold text-xs sm:text-sm flex justify-between items-center">
                        <span id="selectedConditionLabel" class="truncate">Đang chọn...</span>
                        <svg class="w-4 h-4 shrink-0 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 9l-7 7-7-7"></path></svg>
                    </button>
                    <div id="conditionSelectMenu" class="hidden absolute left-0 right-0 top-full mt-1 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl shadow-2xl p-1.5 z-50 space-y-1"></div>
                </div>
            </div>

            <!-- Linh Kiện -->
            <div class="border-t border-slate-200 dark:border-slate-800 pt-3.5">
                <div class="flex items-center justify-between gap-2 mb-3 border-b border-slate-200 dark:border-slate-800 pb-2">
                    <div class="flex items-center gap-2">
                        <span class="bg-red-600 text-white w-6 h-6 rounded-md flex items-center justify-center font-bold text-xs shrink-0">3</span>
                        <h2 class="text-xs sm:text-sm font-bold uppercase font-tech">Trừ lỗi & Linh kiện</h2>
                    </div>
                    <div class="flex items-center gap-1.5">
                        <!-- NÚT TRA GIÁ TẤT CẢ SIÊU TỐC -->
                        <button type="button" onclick="fetchAllDtvPrices()" class="text-[11px] text-amber-700 dark:text-amber-300 font-semibold bg-amber-50 dark:bg-amber-950/50 border border-amber-200 dark:border-amber-800 px-2.5 py-1 rounded-lg transition active:scale-95 flex items-center gap-1">
                            <span id="fetchAllBtnIcon">⚡</span> <span id="fetchAllBtnText">Tự động tra DTV</span>
                        </button>
                        <button type="button" onclick="resetAllRepairs()" class="text-[11px] text-rose-600 dark:text-rose-400 font-semibold bg-rose-50 dark:bg-rose-950/50 border border-rose-200 dark:border-rose-800 px-2.5 py-1 rounded-lg transition">Đặt lại</button>
                    </div>
                </div>

                <!-- Đốm Cam -->
                <div class="bg-amber-50 dark:bg-amber-950/30 border border-amber-200 dark:border-amber-900/50 p-2.5 rounded-xl mb-3">
                    <div class="flex items-center justify-between mb-2">
                        <h3 class="font-bold text-amber-700 dark:text-amber-400 text-xs">Lỗi Đốm Camera</h3>
                    </div>
                    <div class="grid grid-cols-3 gap-2">
                        <button type="button" onclick="selectDomCam(0, this)" class="dom-btn active w-full py-1.5 text-xs rounded-lg border bg-white dark:bg-slate-950 transition">Không đốm</button>
                        <button type="button" onclick="selectDomCam(500000, this)" class="dom-btn w-full py-1.5 text-xs rounded-lg border bg-white dark:bg-slate-950 transition">1 cam (-500k)</button>
                        <button type="button" onclick="selectDomCam(800000, this)" class="dom-btn w-full py-1.5 text-xs rounded-lg border bg-white dark:bg-slate-950 transition">2 cam (-800k)</button>
                    </div>
                </div>

                <div id="repairList" class="grid grid-cols-1 sm:grid-cols-2 gap-2 text-xs"></div>
            </div>
        </div>

        <!-- 4. KẾT QUẢ TÀI CHÍNH -->
        <div id="resultBox" class="bg-white dark:bg-slate-900 rounded-2xl p-4 shadow-sm border border-slate-200 dark:border-slate-800 hidden space-y-3 animate-fade-in-up">
            <div class="flex items-center gap-2 border-b border-slate-200 dark:border-slate-800 pb-2">
                <span class="bg-red-600 text-white w-6 h-6 rounded-md flex items-center justify-center font-bold text-xs shrink-0">4</span>
                <h2 class="text-xs sm:text-sm font-bold uppercase font-tech">Chi tiết tài chính</h2>
            </div>
            <div class="space-y-2 text-xs sm:text-sm">
                <div class="flex justify-between"><span id="txtBasePriceLabel">Giá máy cũ:</span><span id="txtBasePrice" class="font-semibold">0đ</span></div>
                <div class="flex justify-between text-rose-600 dark:text-rose-400"><span>Trừ tiền lỗi:</span><span id="txtRepairDeduction" class="font-semibold">- 0đ</span></div>
            </div>
            <div class="pt-2 border-t border-slate-200 dark:border-slate-800">
                <div class="flex justify-between items-center text-lg sm:text-xl font-bold bg-gradient-to-r from-red-600 to-rose-700 p-3 rounded-xl shadow-lg text-white">
                    <span>GIÁ NHẬP CUỐI:</span><span id="txtFinalTotal">0đ</span>
                </div>
            </div>
            <!-- Hiển thị chuỗi copy -->
            <div class="mt-2 bg-slate-50 dark:bg-slate-950 p-2 rounded-xl border border-slate-200 dark:border-slate-800 flex justify-between items-center">
                <p id="proposalText" class="font-mono text-[11px] sm:text-xs font-bold text-slate-700 dark:text-slate-300 break-all"></p>
                <button onclick="copyProposal()" id="copyBtn" class="ml-2 bg-slate-200 dark:bg-slate-800 px-2 py-1 rounded text-[10px] font-bold shrink-0">Copy</button>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
            ? 'http://localhost:3000/api'
            : 'https://he-thong-thu-cu-len-doi-cps.onrender.com/api';

        let currentPhoneData = null, repairItemsData = [], isRepairLoading = false;
        let currentDomCamDeduction = 0, repairStates = {}, editedRawPrices = {}, openEditIndex = null;
        let selectedConditionObj = null;

        const formatMoney = (num) => new Intl.NumberFormat('vi-VN').format(num) + 'đ';

        function removeVietnameseTones(str) {
            return str ? str.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/đ/g, 'd').replace(/Đ/g, 'D') : "";
        }

        function initTheme() {
            const saved = localStorage.getItem('cps_theme');
            if (saved === 'light') { document.documentElement.classList.remove('dark'); }
            else { document.documentElement.classList.add('dark'); }
            updateThemeToggleUI();
        }

        function toggleTheme() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('cps_theme', isDark ? 'dark' : 'light');
            updateThemeToggleUI();
        }

        function updateThemeToggleUI() {
            const isDark = document.documentElement.classList.contains('dark');
            document.getElementById('themeIcon').textContent = isDark ? '☀️' : '🌙';
        }

        async function searchPhones() {
            const keyword = document.getElementById('searchInput').value.trim().toLowerCase();
            if (keyword.length < 2) return;
            const listEl = document.getElementById('phoneList');
            listEl.innerHTML = '<p class="p-2.5 text-slate-500 text-xs">Đang tìm kiếm...</p>';
            listEl.classList.remove('hidden');

            try {
                const res = await fetch(`${API_BASE}/phones?q=${encodeURIComponent(keyword)}`);
                const phones = await res.json();
                renderPhoneList(phones);
            } catch (err) {
                listEl.innerHTML = '<p class="p-2.5 text-red-600 text-xs">Lỗi mạng.</p>';
            }
        }

        function renderPhoneList(phones) {
            const listEl = document.getElementById('phoneList');
            listEl.innerHTML = '';
            if (phones.length === 0) { listEl.innerHTML = '<p class="p-2.5 text-red-600 text-xs">Không tìm thấy máy.</p>'; return; }
            phones.forEach(p => {
                const div = document.createElement('div');
                div.className = 'p-2.5 cursor-pointer border-b border-slate-200 dark:border-slate-800 hover:bg-slate-200 dark:hover:bg-slate-800 rounded-lg flex justify-between';
                div.innerHTML = `<span class="font-bold text-xs sm:text-sm">${p.name}</span><span class="text-red-600 font-bold">${formatMoney(p.thu_loai_1)}</span>`;
                div.onclick = () => selectPhone(p);
                listEl.appendChild(div);
            });
        }

        async function selectPhone(phone) {
            currentPhoneData = phone;
            document.getElementById('phoneList').classList.add('hidden');
            document.getElementById('selectedPhoneName').textContent = `- ${phone.name}`;
            
            const opts = [
                { price: phone.thu_loai_1, name: 'LOẠI 1', label: 'Đẹp', badge: 'text-emerald-500' },
                { price: phone.thu_loai_2, name: 'LOẠI 2', label: 'Trầy nhẹ', badge: 'text-blue-500' },
                { price: phone.thu_loai_3, name: 'LOẠI 3', label: 'Cấn móp', badge: 'text-amber-500' },
                { price: phone.thu_loai_4, name: 'LOẠI 4', label: 'Xấu', badge: 'text-rose-500' }
            ];

            const menu = document.getElementById('conditionSelectMenu');
            menu.innerHTML = '';
            opts.forEach((opt, idx) => {
                const item = document.createElement('div');
                item.className = 'p-2 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-lg cursor-pointer flex justify-between';
                item.innerHTML = `<span class="font-bold ${opt.badge}">${opt.name} - ${opt.label}</span><span class="font-bold">${formatMoney(opt.price)}</span>`;
                item.onclick = () => {
                    selectedConditionObj = opt;
                    document.getElementById('selectedConditionLabel').innerHTML = `<span class="${opt.badge}">${opt.name}</span> - ${formatMoney(opt.price)}`;
                    document.getElementById('conditionSelectMenu').classList.add('hidden');
                    calculateTotal();
                };
                menu.appendChild(item);
                if (idx === 0) item.onclick(); 
            });

            ['conditionSection', 'resultBox'].forEach(id => document.getElementById(id).classList.remove('hidden'));
            
            repairStates = {}; editedRawPrices = {}; openEditIndex = null;
            document.getElementById('repairList').innerHTML = '<p class="col-span-2 text-xs text-center py-4">Đang tải danh sách linh kiện...</p>';

            try {
                const res = await fetch(`${API_BASE}/repairs?name=${encodeURIComponent(phone.name)}`);
                const data = await res.json();
                repairItemsData = data.items || [];
                renderRepairs();
                calculateTotal();
                
                // TỰ ĐỘNG KÍCH HOẠT TRA DTV TẤT CẢ SONG SONG
                fetchAllDtvPrices();
            } catch (e) {
                document.getElementById('repairList').innerHTML = '<p class="text-red-500">Lỗi tải linh kiện</p>';
            }
        }

        // --- HÀM TRA GIÁ DTV SONG SONG SIÊU TỐC ---
        async function fetchAllDtvPrices() {
            if (!repairItemsData || repairItemsData.length === 0 || !currentPhoneData) return;
            const btnText = document.getElementById('fetchAllBtnText');
            if (btnText) btnText.textContent = 'Đang tự tra DTV...';

            // Dùng Promise.allSettled để gửi cùng lúc tất cả request thay vì chờ từng cái (Nhanh gấp 10 lần)
            const promises = repairItemsData.map((_, i) => autoFetchPriceFromDTV(i, true));
            await Promise.allSettled(promises);

            if (btnText) btnText.textContent = 'Tự động tra DTV';
            renderRepairs(); // Render lại 1 lần cuối cho mượt
        }

        async function autoFetchPriceFromDTV(index, isBatch = false) {
            const item = repairItemsData[index];
            if (!item || !currentPhoneData) return;
            
            const serviceSlug = item.label; // Backend sẽ tự mapping slug chuẩn
            const phoneSlug = currentPhoneData.name;

            const btn = document.getElementById(`dtvBtn_${index}`);
            if (btn && !isBatch) btn.textContent = '⏳';

            try {
                const response = await fetch(`${API_BASE}/get-dtv-price?service=${encodeURIComponent(serviceSlug)}&phone=${encodeURIComponent(phoneSlug)}`);
                const data = await response.json();

                if (data.success && data.rawPrice > 0) {
                    editedRawPrices[index] = data.rawPrice;
                    if (!isBatch) {
                        updateCardUI(index);
                        calculateTotal();
                        if (btn) btn.textContent = '✅';
                    }
                } else {
                    if (btn && !isBatch) btn.textContent = 'Lỗi';
                }
            } catch (err) {
                if (btn && !isBatch) btn.textContent = 'Tra lại';
            }
        }

        // QUY TẮC TRỪ LỖI CHUẨN XÁC
        function getItemDeduction(item, index) {
            let rawPrice = editedRawPrices[index] !== undefined ? parseFloat(editedRawPrices[index]) : (parseFloat(item.deduction) || 0);
            if (rawPrice <= 0) return { rawPrice: 0, deduction: 0, formulaText: 'Chưa có giá' };

            const l = removeVietnameseTones(item.label || '').toLowerCase();

            // 1. Vỏ, Kính lưng, Mặt lưng
            if (l.includes("vo") || l.includes("kinh lung") || l.includes("mat lung")) {
                return { rawPrice, deduction: Math.round(rawPrice), formulaText: 'Trừ nguyên giá' };
            }
            // 2. Màn hình, Kính, Ép kính, Cảm ứng
            if (l.includes("man") || l.includes("kinh") || l.includes("ep kinh") || l.includes("cam ung")) {
                let discount = rawPrice * 0.15;
                if (discount > 500000) discount = 500000;
                return { rawPrice, deduction: Math.round(rawPrice - discount), formulaText: 'Giảm 15% (Max 500k)' };
            }
            // 3. Pin, Cam, Loa, Face ID, Rung...
            return { rawPrice, deduction: Math.round(rawPrice * 0.7), formulaText: 'Giảm 30%' };
        }

        function renderRepairs() {
            const listEl = document.getElementById('repairList');
            listEl.innerHTML = '';
            
            repairItemsData.forEach((item, index) => {
                const details = getItemDeduction(item, index);
                const isError = repairStates[index] || false;
                const isEditing = (openEditIndex === index);

                const card = document.createElement('div');
                card.className = 'bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl p-2 flex flex-col justify-between space-y-1.5';
                
                let priceHtml = details.deduction > 0 
                    ? `<div class="bg-white dark:bg-slate-900 p-1.5 rounded-lg grid grid-cols-3 gap-1 items-center text-[10px] border border-slate-200 dark:border-slate-800">
                        <div><span class="text-slate-500 block">Gốc:</span><b>${formatMoney(details.rawPrice)}</b></div>
                        <div class="text-center"><span class="text-amber-600 font-bold block">${details.formulaText}</span></div>
                        <div class="text-right"><span class="text-slate-500 block">Trừ:</span><b class="text-red-500">${formatMoney(details.deduction)}</b></div>
                       </div>`
                    : `<div class="text-[10px] bg-amber-50 dark:bg-amber-950/20 p-1.5 rounded-lg text-amber-700 text-center block border border-amber-100">Chưa có giá • Bấm "Tra DTV"</div>`;

                let editBoxHtml = isEditing ? `<div class="flex gap-1 mt-1"><input type="number" id="inputPrice_${index}" value="${editedRawPrices[index]||''}" oninput="editedRawPrices[${index}]=this.value" class="flex-1 p-1 text-xs text-black border rounded"><button onclick="updateCardUI(${index});calculateTotal();openEditIndex=null;renderRepairs()" class="bg-red-500 text-white px-2 rounded text-xs">OK</button></div>` : '';

                card.innerHTML = `
                    <div class="flex items-center justify-between">
                        <span class="font-bold text-xs text-slate-800 dark:text-slate-200">${item.label}</span>
                        <div class="flex gap-1">
                            <button onclick="openEditIndex=${openEditIndex===index?null:index};renderRepairs()" class="px-1.5 py-0.5 text-[10px] border rounded bg-white dark:bg-slate-900">Sửa giá</button>
                            <button id="dtvBtn_${index}" onclick="autoFetchPriceFromDTV(${index})" class="px-1.5 py-0.5 text-[10px] border rounded bg-amber-50 dark:bg-amber-950/50 text-amber-600">Tra DTV</button>
                        </div>
                    </div>
                    ${priceHtml}
                    ${editBoxHtml}
                    <div class="flex gap-1 mt-1">
                        <button onclick="repairStates[${index}]=false;renderRepairs();calculateTotal()" class="flex-1 py-1 text-[11px] rounded border ${!isError ? 'bg-emerald-50 border-emerald-300 text-emerald-600 font-bold' : 'bg-white text-slate-500'}">Không lỗi</button>
                        <button onclick="repairStates[${index}]=true;renderRepairs();calculateTotal()" class="flex-1 py-1 text-[11px] rounded border ${isError ? 'bg-red-50 border-red-300 text-red-600 font-bold' : 'bg-white text-slate-500'}">Có lỗi ${details.deduction>0 ? `(-${formatMoney(details.deduction)})`:''}</button>
                    </div>
                `;
                listEl.appendChild(card);
            });
        }

        function updateCardUI(index) { renderRepairs(); }
        function selectDomCam(val, btn) { currentDomCamDeduction = val; document.querySelectorAll('.dom-btn').forEach(b => b.classList.remove('active')); btn.classList.add('active'); calculateTotal(); }
        function resetAllRepairs() { repairStates = {}; editedRawPrices = {}; currentDomCamDeduction = 0; document.querySelectorAll('.dom-btn').forEach((b,i)=>i===0?b.classList.add('active'):b.classList.remove('active')); renderRepairs(); calculateTotal(); }
        function toggleDropdown(id) { document.getElementById(id).classList.toggle('hidden'); }

        function calculateTotal() {
            if (!currentPhoneData || !selectedConditionObj) return;
            const basePrice = parseFloat(selectedConditionObj.price) || 0;
            let totalDeduction = currentDomCamDeduction;
            let parts = [`${selectedConditionObj.name} ${Math.round(basePrice/1000)}`];

            if (currentDomCamDeduction > 0) parts.push(`- ${currentDomCamDeduction/1000} ĐỐM CAM`);

            repairItemsData.forEach((item, idx) => {
                if (repairStates[idx]) {
                    const det = getItemDeduction(item, idx);
                    if (det.deduction > 0) {
                        totalDeduction += det.deduction;
                        parts.push(`- ${Math.round(det.deduction/1000)} ${removeVietnameseTones(item.label).toUpperCase()}`);
                    }
                }
            });

            const finalPrice = Math.max(0, basePrice - totalDeduction);
            parts.push(`= ${Math.round(finalPrice/1000)}`);

            document.getElementById('txtBasePrice').textContent = formatMoney(basePrice);
            document.getElementById('txtRepairDeduction').textContent = `- ${formatMoney(totalDeduction)}`;
            document.getElementById('txtFinalTotal').textContent = formatMoney(finalPrice);
            document.getElementById('proposalText').textContent = parts.join(' ');
        }

        async function copyProposal() {
            await navigator.clipboard.writeText(document.getElementById('proposalText').textContent);
            const btn = document.getElementById('copyBtn');
            btn.textContent = "Đã Copy!"; setTimeout(() => btn.textContent = "Copy", 1500);
        }
        
        document.addEventListener('DOMContentLoaded', initTheme);
    </script>
</body>
